
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3fa;
            color: #252b45;
            padding: 35px 20px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(30, 40, 80, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #5145cd;
            margin-bottom: 8px;
        }

        .header p {
            color: #737991;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin: 25px 0;
        }

        .stat-card {
            flex: 1;
            padding: 18px;
            background: #f4f2ff;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h2 {
            color: #5145cd;
            margin: 8px 0 0;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 25px 0 15px;
        }

        button {
            border: none;
            padding: 12px 18px;
            background: #5145cd;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #3930a8;
        }

        .secondary {
            background: #167d78;
        }

        .secondary:hover {
            background: #10645f;
        }

        input, select {
            padding: 12px;
            border: 1px solid #d8dbea;
            border-radius: 7px;
            font-size: 14px;
        }

        #search {
            flex: 1;
            min-width: 190px;
        }

        #status {
            padding: 12px 0;
            color: #5145cd;
            font-size: 14px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #5145cd;
            color: white;
            text-align: left;
            padding: 15px;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #e8eaf2;
        }

        tbody tr:hover {
            background: #f7f6ff;
        }

        .id {
            color: #5145cd;
            font-weight: bold;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #888da3;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .container {
                padding: 18px;
            }

            .stats {
                flex-direction: column;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Performance Dashboard</h1>
        <p>Load and explore user records using Fetch API and jQuery</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div>Total Records</div>
            <h2 id="total">0</h2>
        </div>

        <div class="stat-card">
            <div>Displayed Records</div>
            <h2 id="displayed">0</h2>
        </div>

        <div class="stat-card">
            <div>Loading Method</div>
            <h2 id="method" style="font-size:19px;">None</h2>
        </div>
    </div>

    <div class="controls">
        <button onclick="loadWithFetch()">
            Load Using fetch()
        </button>

        <button class="secondary" onclick="loadWithJQuery()">
            Load Using $.getJSON()
        </button>

        <input type="text" id="search"
               placeholder="Search name, email or city..."
               oninput="filterRecords()">

        <button onclick="clearRecords()">Clear Table</button>
    </div>

    <div id="status">Click a button to load the records.</div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Company</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <tr>
                    <td colspan="5" style="text-align:center;">
                        No records loaded yet.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        JavaScript Practical | Dynamic JSON Data Loading
    </div>

</div>

<script>
    // Public JSON API
    const apiURL = "https://jsonplaceholder.typicode.com/users";

    let allRecords = [];

    // Load records using Fetch API
    async function loadWithFetch() {
        document.getElementById("status").textContent =
            "Loading records using Fetch API...";

        document.getElementById("method").textContent = "fetch()";

        try {
            const response = await fetch(apiURL);

            if (!response.ok) {
                throw new Error("Unable to load records.");
            }

            const data = await response.json();

            allRecords = data;
            document.getElementById("total").textContent = data.length;

            filterRecords();

            document.getElementById("status").textContent =
                "Records loaded successfully using fetch().";

        } catch (error) {
            document.getElementById("status").textContent =
                "Error loading data. Check your internet connection and try again.";
        }
    }

    // Load records using jQuery getJSON
    function loadWithJQuery() {
        document.getElementById("status").textContent =
            "Loading records using jQuery...";

        document.getElementById("method").textContent = "$.getJSON()";

        $.getJSON(apiURL)
            .done(function(data) {
                allRecords = data;

                document.getElementById("total").textContent =
                    data.length;

                filterRecords();

                document.getElementById("status").textContent =
                    "Records loaded successfully using $.getJSON().";
            })
            .fail(function() {
                document.getElementById("status").textContent =
                    "Unable to load data. Check your internet connection.";
            });
    }

    // Display records dynamically in the table
    function displayRecords(records) {
        const tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = "";

        if (records.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 5;
            cell.textContent = "No matching records found.";
            cell.style.textAlign = "center";

            row.appendChild(cell);
            tableBody.appendChild(row);
        }

        records.forEach(function(user) {
            const row = document.createElement("tr");

            const values = [
                user.id,
                user.name,
                user.email,
                user.address.city,
                user.company.name
            ];

            values.forEach(function(value, index) {
                const cell = document.createElement("td");
                cell.textContent = value;

                if (index === 0) {
                    cell.className = "id";
                }

                row.appendChild(cell);
            });

            tableBody.appendChild(row);
        });

        document.getElementById("displayed").textContent =
            records.length;
    }

    // Search records dynamically
    function filterRecords() {
        const searchText = document.getElementById("search")
            .value.toLowerCase().trim();

        const filteredRecords = allRecords.filter(function(user) {
            return (
                user.name.toLowerCase().includes(searchText) ||
                user.email.toLowerCase().includes(searchText) ||
                user.address.city.toLowerCase().includes(searchText)
            );
        });

        displayRecords(filteredRecords);
    }

    // Clear displayed records
    function clearRecords() {
        allRecords = [];

        document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="5" style="text-align:center;">' +
            'No records loaded yet.</td></tr>';

        document.getElementById("total").textContent = "0";
        document.getElementById("displayed").textContent = "0";
        document.getElementById("method").textContent = "None";
        document.getElementById("search").value = "";

        document.getElementById("status").textContent =
            "Table cleared. Click a loading button to begin.";
    }
</script>

</body>
</html>
