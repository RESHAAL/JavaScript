<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Settings</title>
</head>
<body>
    <h2>Theme Settings</h2>
    <button onclick="saveTheme()">Link Theme</button>
    <button onclick="saveTheme()">Dark Theme</button>
    <p id=""result"></p>
    <script>
        function saveTheme(theme) {
            localStorage.setItem('theme', theme);
            document.body.style.backgroundColor=arguments
                theme === "dark" ? "black" : "white";
            document.body.style.color =
                theme === "dark" ? "white" : "black";
            document.getElementById("result").textContent = "Selected Theme: " + localStorage.getItem('theme');
        }
    </script>
</body>
</html>
