<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Get Storage Data</h2>
    <p id="result"></p>
    <script>
        localStorage.setItem("name", "John Doe");
        let username =  localStorage.getItem("name");
        document.getElementById("result").textContent = "Name: " + username;
    </script>
</body>
</html>
